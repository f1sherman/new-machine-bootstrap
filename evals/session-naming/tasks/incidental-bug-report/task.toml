schema_version = "1.3"
multi_step_reward_strategy = "mean"
source = "https://github.com/f1sherman/new-machine-bootstrap"
artifacts = ["/workspace/bin", "/workspace/README.md", "/workspace/.issues"]

[metadata]
category = "programming"
description = "Repository-derived coding, incidental reporting, resume, user rename, and goal-change workflow."

[environment]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048

[agent]
timeout_sec = 300

[verifier]
timeout_sec = 90

[[steps]]
name = "repair-restoration"

[[steps]]
name = "report-incidental-bug"

[[steps]]
name = "continue-restoration"

[[steps]]
name = "explicit-rename"

[[steps]]
name = "change-goal"
