---
name: Integration Test

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Run provisioning
        run: bin/provision
        env:
          ANSIBLE_CALLBACKS_ENABLED: profile_tasks
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify commit wrapper ignored docs protection
        run: bash tests/commit-force-add-superpowers.sh

      - name: Verify provision concurrency lock
        run: bash tests/provision-concurrency-lock.sh

      - name: Test provision log provenance
        run: bash tests/provision-log-provenance.sh

      - name: Verify retired HNP launcher cleanup
        run: bash tests/retired-hnp-launcher-cleanup.sh

      - name: Verify tmux restore startup coordination
        run: ruby tests/tmux-restore-startup.rb

      - name: Verify interrupted tmux-resurrect recovery
        run: ruby tests/tmux-resurrect-recover.rb

      - name: Verify tmux-resurrect save serialization
        run: ruby tests/tmux-resurrect-save-wrapper.rb

      - name: Verify tmux-resurrect extra save fields
        run: ruby tests/tmux-resurrect-save-extra.rb

      - name: Verify tmux-resurrect extra field restoration
        run: ruby tests/tmux-resurrect-restore-extra.rb

      - name: Verify Ghostty session manifest
        run: ruby tests/ghostty-session-manifest.rb

      - name: Verify Ghostty session tab builder
        run: ruby tests/ghostty-session-tabs-restore.rb

      - name: Verify tmux restore diagnostics
        run: bash tests/tmux-restore-diagnostics.sh

      - name: Verify tmux-resurrect Neovim space paths
        run: bash tests/tmux-resurrect-nvim-space-path.sh

      - name: Verify murder helper behavior
        run: ruby tests/murder.rb

      - name: Verify repo lifecycle helpers
        run: bash tests/repo-lifecycle.sh

      - name: Verify repo-end callback behavior
        run: bash tests/repo-end-callbacks.sh

      - name: Verify repo-start callback behavior
        run: bash tests/repo-start-callbacks.sh

      - name: Verify tmux label contract
        run: bash tests/tmux-label-contract.sh

      - name: Verify tmux agent state helper
        run: bash tests/tmux-agent-state.sh

      - name: Verify Pi main worktree mutation guard
        run: bash tests/pi-main-worktree-guard.sh

      - name: Verify Pi main worktree guard provisioning
        run: bash tests/pi-main-worktree-guard-provisioning.sh

      - name: Verify pi managed hooks
        run: bash tests/pi-managed-hooks.sh

      - name: Verify Pi session registry adapter
        run: ruby tests/pi-session-registry-adapter.rb

      - name: Verify Pi session completion
        run: ruby tests/pi-session-done.rb

      - name: Verify Pi session staleness publisher
        run: ruby tests/pi-session-staleness-publish.rb

      - name: Verify Pi session staleness provisioning
        run: bash tests/pi-session-staleness-provisioning.sh

      - name: Verify stale per-Node Pi purge
        run: bash tests/purge-legacy-pi-coding-agent.sh

      - name: Verify Pi Aube install layout
        run: ruby tests/pi-aube-install-layout-contract.rb

      - name: Verify mise install selection
        run: ruby tests/mise-install-selection.rb

      - name: Verify mise download failure handling
        run: ruby tests/mise-install-download.rb

      - name: Verify gsd-browser install behavior
        run: ruby tests/gsd-browser-install.rb

      - name: Verify Claude agent subject hook settings
        run: bash tests/claude-agent-subject-hook-settings.sh

      - name: Verify managed global Git ignore
        run: bash tests/gitignore-contract.sh

      - name: Verify tmux pane-link contract
        run: bash tests/tmux-pane-link.sh

      - name: Verify current-spec publisher
        run: ruby tests/agent-current-spec-hook.rb

      - name: Verify Claude SessionStart hook contract
        run: bash tests/tmux-claude-session-start.sh

      - name: Verify Codex SessionStart hook contract
        run: bash tests/codex-bind-tmux-pane.sh

      - name: Verify Codex hook trust provisioning
        run: bash tests/codex-hook-trust.sh

      - name: Verify Claude working-status hooks target their own session
        run: bash tests/claude-working-title-target.sh
