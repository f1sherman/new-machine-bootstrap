---
- name: Check if Pi settings.json exists
  stat:
    path: "{{ pi_agent_dir }}/settings.json"
  register: pi_settings_stat

- name: Read existing Pi settings.json if it exists
  slurp:
    src: "{{ pi_agent_dir }}/settings.json"
  register: pi_settings_content
  when: pi_settings_stat.stat.exists

- name: Parse existing Pi settings or use empty object
  set_fact:
    pi_settings: "{{ (pi_settings_content.content | b64decode | from_json) if pi_settings_stat.stat.exists else {} }}"

- name: Build Pi subagent main worktree guard overrides
  vars:
    guard_extension: "{{ pi_agent_dir }}/extensions/main-worktree-guard.ts"
    existing_overrides: "{{ pi_settings.get('subagents', {}).get('agentOverrides', {}) }}"
  set_fact:
    pi_subagent_main_worktree_guard_overrides:
      worker:
        subagentOnlyExtensions: "{{ ((existing_overrides.get('worker', {}).get('subagentOnlyExtensions', []) | default([], true)) + [guard_extension]) | unique }}"
      reviewer:
        subagentOnlyExtensions: "{{ ((existing_overrides.get('reviewer', {}).get('subagentOnlyExtensions', []) | default([], true)) + [guard_extension]) | unique }}"
      delegate:
        subagentOnlyExtensions: "{{ ((existing_overrides.get('delegate', {}).get('subagentOnlyExtensions', []) | default([], true)) + [guard_extension]) | unique }}"
      planner:
        subagentOnlyExtensions: "{{ ((existing_overrides.get('planner', {}).get('subagentOnlyExtensions', []) | default([], true)) + [guard_extension]) | unique }}"
      oracle:
        subagentOnlyExtensions: "{{ ((existing_overrides.get('oracle', {}).get('subagentOnlyExtensions', []) | default([], true)) + [guard_extension]) | unique }}"
      scout:
        subagentOnlyExtensions: "{{ ((existing_overrides.get('scout', {}).get('subagentOnlyExtensions', []) | default([], true)) + [guard_extension]) | unique }}"
      context-builder:
        subagentOnlyExtensions: "{{ ((existing_overrides.get('context-builder', {}).get('subagentOnlyExtensions', []) | default([], true)) + [guard_extension]) | unique }}"
      researcher:
        subagentOnlyExtensions: "{{ ((existing_overrides.get('researcher', {}).get('subagentOnlyExtensions', []) | default([], true)) + [guard_extension]) | unique }}"

- name: Initialize preserved Pi package entries
  set_fact:
    pi_preserved_packages: []

- name: Preserve Pi packages other than managed compaction extensions
  set_fact:
    pi_preserved_packages: "{{ pi_preserved_packages + [item] }}"
  loop: "{{ pi_settings.get('packages', []) }}"
  when: >-
    ((item.source if item is mapping else item) |
    regex_search('^git:github\.com/algal/pi-openai-server-compaction(@[^@]+)?$')) is none and
    ((item.source if item is mapping else item) |
    regex_search('^npm:@ogulcancelik/pi-codex-compaction(@[^@]+)?$')) is none

- name: Merge managed Pi settings
  set_fact:
    pi_merged_settings: >-
      {{ pi_settings | combine({
        'hideThinkingBlock': true,
        'quietStartup': true,
        'collapseChangelog': true,
        'packages': pi_preserved_packages + ['npm:@ogulcancelik/pi-codex-compaction@0.1.3'],
        'subagents': {'agentOverrides': pi_subagent_main_worktree_guard_overrides}
      }, recursive=True) }}

- name: Write merged Pi settings.json
  copy:
    content: "{{ pi_merged_settings | to_nice_json }}"
    dest: "{{ pi_agent_dir }}/settings.json"
    mode: '0600'
    backup: yes
