---
- name: Check installed OmniWM version
  command: >-
    /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString'
    /Applications/OmniWM.app/Contents/Info.plist
  register: omniwm_installed_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Record whether OmniWM requires installation
  set_fact:
    omniwm_update_required: >-
      {{
        omniwm_installed_version.stdout !=
        (tool_versions.github_releases.omniwm | regex_replace('^v', ''))
      }}

- name: Report pending OmniWM application update in check mode
  debug:
    msg: >-
      OmniWM {{ tool_versions.github_releases.omniwm }} would be installed.
  changed_when: true
  when:
    - ansible_check_mode
    - omniwm_update_required

- name: Ensure LaunchAgents directory exists for OmniWM
  file:
    path: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents"
    state: directory
    mode: '0755'

- name: Install OmniWM LaunchAgent plist
  template:
    src: launchd/com.user.omniwm.plist
    dest: >-
      {{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.user.omniwm.plist
    mode: '0644'
  register: omniwm_launch_agent_plist

- name: Check whether OmniWM launchd job is loaded
  command: >-
    launchctl print
    gui/{{ ansible_facts['user_uid'] }}/com.user.omniwm
  register: omniwm_launch_agent_job
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install pinned OmniWM release
  when:
    - omniwm_update_required
    - not ansible_check_mode
  block:
    - name: Create OmniWM staging directory
      tempfile:
        state: directory
        path: /Applications
        prefix: .omniwm-
      register: omniwm_staging_dir

    - name: Download pinned OmniWM release
      get_url:
        url: >-
          https://github.com/BarutSRB/OmniWM/releases/download/{{
          tool_versions.github_releases.omniwm }}/OmniWM-{{
          tool_versions.github_releases.omniwm }}.zip
        dest: '{{ omniwm_staging_dir.path }}/OmniWM.zip'
        mode: '0644'
      register: omniwm_download
      until: omniwm_download is succeeded
      retries: 3
      delay: 10

    - name: Extract pinned OmniWM release without AppleDouble files
      command:
        argv:
          - /usr/bin/ditto
          - -x
          - -k
          - '{{ omniwm_staging_dir.path }}/OmniWM.zip'
          - '{{ omniwm_staging_dir.path }}'

    - name: Check staged OmniWM version
      command: >-
        /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString'
        {{ omniwm_staging_dir.path }}/OmniWM.app/Contents/Info.plist
      register: omniwm_staged_version
      changed_when: false

    - name: Verify staged OmniWM version
      assert:
        that:
          - >-
            omniwm_staged_version.stdout ==
            (tool_versions.github_releases.omniwm | regex_replace('^v', ''))
        fail_msg: >-
          Staged OmniWM version {{ omniwm_staged_version.stdout }} does not
          match {{ tool_versions.github_releases.omniwm }}.

    - name: Verify staged OmniWM code signature
      command:
        argv:
          - /usr/bin/codesign
          - --verify
          - --deep
          - --strict
          - '{{ omniwm_staging_dir.path }}/OmniWM.app'
      changed_when: false

    - name: Stop loaded OmniWM job before application replacement
      command: >-
        launchctl bootout
        gui/{{ ansible_facts['user_uid'] }}/com.user.omniwm
      when: omniwm_launch_agent_job.rc == 0

    - name: Remove old OmniWM application
      file:
        path: /Applications/OmniWM.app
        state: absent

    - name: Install staged OmniWM application
      command:
        argv:
          - mv
          - '{{ omniwm_staging_dir.path }}/OmniWM.app'
          - /Applications/OmniWM.app

    - name: Record OmniWM application update
      set_fact:
        omniwm_app_updated: true
  always:
    - name: Remove OmniWM staging directory
      file:
        path: '{{ omniwm_staging_dir.path }}'
        state: absent
      when:
        - omniwm_staging_dir is defined
        - omniwm_staging_dir.path is defined

- name: Link OmniWM command-line client
  file:
    src: /Applications/OmniWM.app/Contents/MacOS/omniwmctl
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/omniwmctl"
    state: link
    force: true

- name: Stop loaded OmniWM job before plist reload
  command: >-
    launchctl bootout
    gui/{{ ansible_facts['user_uid'] }}/com.user.omniwm
  when:
    - not ansible_check_mode
    - omniwm_launch_agent_job.rc == 0
    - omniwm_launch_agent_plist.changed
    - not (omniwm_app_updated | default(false))

- name: Check whether OmniWM settings exist before launch
  stat:
    path: "{{ ansible_facts['user_dir'] }}/.config/omniwm/settings.toml"
  register: omniwm_settings_before_launch
  check_mode: false

- name: Ensure OmniWM state directory exists after completed migration
  file:
    path: "{{ ansible_facts['user_dir'] }}/.local/state/omniwm"
    state: directory
    mode: '0700'
  when: >-
    omniwm_workspace_layout_migration_complete | default(false) | bool

- name: Record completed OmniWM workspace migration
  copy:
    content: "workspace-layout-migrated-v1\n"
    dest: "{{ ansible_facts['user_dir'] }}/.local/state/omniwm/workspace-layout-migrated-v1"
    mode: '0600'
  when: >-
    omniwm_workspace_layout_migration_complete | default(false) | bool

- name: Check whether OmniWM workspace migration is complete
  stat:
    path: "{{ ansible_facts['user_dir'] }}/.local/state/omniwm/workspace-layout-migrated-v1"
  register: omniwm_workspace_layout_marker
  check_mode: false

- name: Check for unsafe OmniWM assignments before launch
  script:
    cmd: >-
      configure-omniwm-settings
      {{ ansible_facts['user_dir'] }}/.config/omniwm/settings.toml
      --check
  register: omniwm_deferred_preflight
  changed_when: false
  check_mode: false
  when:
    - omniwm_settings_before_launch.stat.exists
    - not omniwm_workspace_layout_marker.stat.exists

- name: Stop loaded OmniWM job before deferred reconciliation
  command: >-
    launchctl bootout
    gui/{{ ansible_facts['user_uid'] }}/com.user.omniwm
  register: omniwm_deferred_launch_agent_stop
  when:
    - not ansible_check_mode
    - omniwm_launch_agent_job.rc == 0
    - not omniwm_launch_agent_plist.changed
    - not (omniwm_app_updated | default(false))
    - >-
      (omniwm_deferred_preflight.stdout | default('unchanged') | trim) ==
      'changed'

- name: Remove unsafe OmniWM assignments before launch
  script:
    cmd: >-
      configure-omniwm-settings
      {{ ansible_facts['user_dir'] }}/.config/omniwm/settings.toml
  register: omniwm_prelaunch_settings_result
  changed_when: omniwm_prelaunch_settings_result.stdout | trim == 'changed'
  when:
    - not ansible_check_mode
    - >-
      (omniwm_deferred_preflight.stdout | default('unchanged') | trim) ==
      'changed'

- name: Load OmniWM launchd job
  command: >-
    launchctl bootstrap gui/{{ ansible_facts['user_uid'] }}
    {{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.user.omniwm.plist
  when:
    - not ansible_check_mode
    - >-
      omniwm_launch_agent_plist.changed or
      (omniwm_app_updated | default(false)) or
      omniwm_launch_agent_job.rc != 0 or
      (omniwm_deferred_launch_agent_stop is changed)

- name: Wait for OmniWM settings file
  wait_for:
    path: "{{ ansible_facts['user_dir'] }}/.config/omniwm/settings.toml"
    timeout: 15
  when: not ansible_check_mode

- name: Check whether OmniWM settings file exists
  stat:
    path: "{{ ansible_facts['user_dir'] }}/.config/omniwm/settings.toml"
  register: omniwm_settings_file
  check_mode: false

- name: Enable OmniWM IPC
  lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.config/omniwm/settings.toml"
    regexp: '^ipcEnabled = '
    line: 'ipcEnabled = true'
    insertafter: '^\[general\]$'
  register: omniwm_ipc_result
  when: omniwm_settings_file.stat.exists

- name: Configure OmniWM workspace layout
  script:
    cmd: >-
      configure-omniwm-settings
      {{ ansible_facts['user_dir'] }}/.config/omniwm/settings.toml
      {{
        omniwm_workspace_layout_marker.stat.exists |
        ternary('--activate-assignments', '')
      }}
  register: omniwm_settings_result
  changed_when: omniwm_settings_result.stdout | trim == 'changed'
  when: omniwm_settings_file.stat.exists

- name: Stop loaded OmniWM job after configuration update
  command: >-
    launchctl bootout
    gui/{{ ansible_facts['user_uid'] }}/com.user.omniwm
  when:
    - not ansible_check_mode
    - >-
      (omniwm_ipc_result is changed) or
      (omniwm_settings_result is changed)

- name: Reload OmniWM job after configuration update
  command: >-
    launchctl bootstrap gui/{{ ansible_facts['user_uid'] }}
    {{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.user.omniwm.plist
  when:
    - not ansible_check_mode
    - >-
      (omniwm_ipc_result is changed) or
      (omniwm_settings_result is changed)

- name: Ensure Hammerspoon configuration directory exists
  file:
    path: "{{ ansible_facts['user_dir'] }}/.hammerspoon"
    state: directory
    mode: '0755'

- name: Install OmniWM Hammerspoon helpers
  copy:
    src: hammerspoon/omniwm.lua
    dest: "{{ ansible_facts['user_dir'] }}/.hammerspoon/init.local.lua"
    mode: '0644'
  register: omniwm_hammerspoon_config

- name: Verify OmniWM IPC responds
  command: >-
    {{ ansible_facts['user_dir'] }}/.local/bin/omniwmctl ping
  register: omniwm_ipc_ping
  changed_when: false
  until: omniwm_ipc_ping.stdout == 'pong'
  retries: 15
  delay: 1
  when: not ansible_check_mode
